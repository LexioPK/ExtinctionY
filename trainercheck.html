<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Trainer Check - Extinction Y</title>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="header.css">
<script src="header.js" defer></script>
<style>
  body { font-family: "Lexend", sans-serif; background: #f0f0f0; margin: 0; padding: 20px; }
  h1 { text-align: center; margin-bottom: 8px; }
  .subtitle { text-align: center; color: #666; margin-bottom: 20px; }
  .stats-container { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
  .stat-box { background: #f5f5f5; border-radius: 10px; padding: 12px 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
  .stat-number { font-size: 1.5em; font-weight: 700; color: #4285F4; }
  .stat-label { font-size: 0.9em; color: #666; }
  .trainer-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
  .trainer-card { background: #f5f5f5; border-radius: 12px; padding: 14px; box-shadow: 0 3px 8px rgba(0,0,0,0.12); border: 2px solid #dc3545; }
  .trainer-head { font-weight: 700; margin-bottom: 4px; }
  .trainer-sub { color: #666; font-size: 0.92em; margin-bottom: 10px; }
  .issue-block { margin-bottom: 10px; padding-top: 8px; border-top: 1px solid #ddd; }
  .issue-block:first-of-type { border-top: 0; padding-top: 0; }
  .poke-line { display: flex; align-items: center; gap: 8px; font-weight: 600; margin-bottom: 5px; }
  .poke-line img { width: 32px; height: 32px; object-fit: contain; }
  .bad-move { color: #dc3545; font-size: 0.9em; margin-left: 40px; }
  .empty-state { text-align: center; color: #28a745; font-weight: 700; font-size: 1.05em; margin-top: 30px; }
</style>
</head>
<body>
  <h1>Trainer Check</h1>
  <p class="subtitle">Flags trainers with Pokémon that use moves not in their level-up learnset.</p>
  <div class="stats-container">
    <div class="stat-box"><div class="stat-number" id="total-trainers">0</div><div class="stat-label">Total Trainers</div></div>
    <div class="stat-box"><div class="stat-number" id="flagged-trainers">0</div><div class="stat-label">Flagged Trainers</div></div>
    <div class="stat-box"><div class="stat-number" id="flagged-pokemon">0</div><div class="stat-label">Flagged Pokémon</div></div>
  </div>
  <div id="trainer-grid" class="trainer-grid"></div>

<script>
function resolveMovesetKey(poke, movesets) {
  const form = String(poke.Form || "").trim();
  const name = String(poke.Name || "").trim();
  if (form && movesets[form]) return form;
  if (name && movesets[name]) return name;
  const base = (form || name).split("-")[0];
  if (base && movesets[base]) return base;
  return form || name;
}

function getIconSlug(poke) {
  const form = String(poke.Form || "").trim();
  const name = String(poke.Name || "").trim();
  return (window.toSpriteSlug ? window.toSpriteSlug(form || name) : (form || name).toLowerCase().replace(/\s+/g, "-")) || "unknown";
}

function displayName(rawName) {
  if (window.formatPokemonDisplayName) return window.formatPokemonDisplayName(rawName);
  return rawName;
}

function trainerLabel(trainer) {
  const className = String(trainer.TrainerClass || "").trim();
  const trainerName = String(trainer.TrainerName || "").trim();
  return className ? `${className} ${trainerName}`.trim() : trainerName;
}

async function runTrainerCheck() {
  const [trainersRes, movesetsRes] = await Promise.all([
    fetch("data/trainers.json"),
    fetch("data/movesets.json")
  ]);
  const trainersData = await trainersRes.json();
  const movesets = await movesetsRes.json();
  const grid = document.getElementById("trainer-grid");
  grid.innerHTML = "";

  let totalTrainers = 0;
  let flaggedPokemonCount = 0;
  const flagged = [];

  for (const [routeName, routeData] of Object.entries(trainersData || {})) {
    const trainers = routeData?.Trainers || [];
    for (const trainer of trainers) {
      totalTrainers++;
      const pokemonIssues = [];
      for (const poke of (trainer.Pokemon || [])) {
        const speciesKey = resolveMovesetKey(poke, movesets);
        const levelMoves = new Set((movesets[speciesKey] || []).map(m => String(m?.Move || "").trim()).filter(Boolean));
        const usedMoves = (poke.Moves || []).map(m => String(m || "").trim()).filter(Boolean);
        const invalidMoves = usedMoves.filter(move => !levelMoves.has(move));
        if (invalidMoves.length > 0) {
          flaggedPokemonCount++;
          pokemonIssues.push({
            name: poke.Form || poke.Name,
            iconSlug: getIconSlug(poke),
            invalidMoves
          });
        }
      }
      if (pokemonIssues.length > 0) {
        flagged.push({
          route: routeName,
          trainer: trainerLabel(trainer),
          issues: pokemonIssues
        });
      }
    }
  }

  flagged.sort((a, b) => a.route.localeCompare(b.route) || a.trainer.localeCompare(b.trainer));

  document.getElementById("total-trainers").textContent = String(totalTrainers);
  document.getElementById("flagged-trainers").textContent = String(flagged.length);
  document.getElementById("flagged-pokemon").textContent = String(flaggedPokemonCount);

  if (!flagged.length) {
    grid.innerHTML = `<div class="empty-state">✓ No trainer moveset issues found.</div>`;
    return;
  }

  flagged.forEach(entry => {
    const card = document.createElement("div");
    card.className = "trainer-card";
    card.innerHTML = `
      <div class="trainer-head">${entry.trainer}</div>
      <div class="trainer-sub">${entry.route}</div>
      ${entry.issues.map(issue => `
        <div class="issue-block">
          <div class="poke-line">
            <img src="image/icons/${issue.iconSlug}.png" alt="${issue.name}">
            <span>${displayName(issue.name)}</span>
          </div>
          ${issue.invalidMoves.map(move => `<div class="bad-move">• ${move}</div>`).join("")}
        </div>
      `).join("")}
    `;
    card.querySelectorAll(".poke-line img").forEach(img => {
      img.onerror = function() {
        this.onerror = null;
        this.src = "pokemon_sprites/substitute.png";
      };
    });
    grid.appendChild(card);
  });
}

runTrainerCheck().catch(err => {
  console.error(err);
  document.getElementById("trainer-grid").innerHTML = `<div class="empty-state" style="color:#dc3545;">Error loading trainer check data.</div>`;
});
</script>
</body>
</html>
